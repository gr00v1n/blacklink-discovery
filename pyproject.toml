[project]
name = "blacklink-discovery"
version = "0.1.0"
description = "Evidence-first domain discovery for blacklink investigations; no risk classification"
requires-python = ">=3.11"
dependencies = [
  "curl-cffi==0.16.3",
  "httpx>=0.28,<1",
  "idna>=3.10,<4",
  "openpyxl>=3.1,<4",
  "tldextract>=5.1,<6",
  "tree-sitter>=0.25,<0.27",
  "tree-sitter-javascript>=0.25,<0.26",
]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
blacklink-discovery = "blacklink_discovery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
